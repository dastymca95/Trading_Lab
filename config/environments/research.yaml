env_name: research

mode:
  live_trading: false
  paper_trading: true
  execution_enabled: false
  shadow_mode: true

mt5:
  account_alias: demo_icmarkets
  terminal_path: "C:/Program Files/MetaTrader 5/terminal64.exe"

risk:
  max_daily_loss_usd: 50
  max_positions_total: 2
  max_positions_per_symbol: 1
  risk_per_trade_pct: 0.10

execution:
  allowed_order_types: ["market"]
  max_slippage_points: 50
  spread_filter_enabled: true
  latency_checks_enabled: true

logging:
  level: "DEBUG"
  save_trade_journal: true
  save_market_snapshots: true
  save_execution_audit: true

data:
  output_root: "data/"
  reports_root: "reports/"
  logs_root: "logs/"