strategy:
  name: london_range_breakout
  version: v1
  signal_hours_mt5: [15, 18]
  london_session_start_hour: 9
  london_session_end_hour: 15
  scan_minutes_after_signal: [2, 3]

filters:
  volume_history_from: "2018-01-01"
  prefer_parquet_for_volume_mean: true

audit:
  columns:
    - datetime
    - asset
    - direction
    - lots
    - signal_price
    - real_entry_price
    - slippage_pts
    - spread_signal
    - spread_at_entry
    - execution_ms
    - pnl_real
    - pnl_backtest_approx
    - exit_reason

assets:
